name: Build and Sync Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: # This allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Ensures it can push back to the repo properly

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build Executable
      run: pyinstaller --onefile Licker.py

    - name: Sync EXE to Repo
      shell: cmd
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        copy /Y dist\Licker.exe .
        git add Licker.exe
        git commit -m "Auto-build: Update Licker.exe" || exit 0
        git push
