name: Build and Sync Executable

on:
  push:
    branches: [ main ]
    paths:
      - 'Licker.py' # Only runs when the python code changes

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Crucial for pushing the file back to the repo

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build Executable
      run: pyinstaller --onefile Licker.py

    - name: Sync EXE to Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        copy dist\Licker.exe .
        git add Licker.exe
        git commit -m "Auto-build: Update Licker.exe" || echo "No changes to commit"
        git push
